name: Fix dashboard syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Auto-fix dashboard syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix missing callback brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/EnhancedDashboard.tsx')
          t=p.read_text()
          old="nmPend:rs.reduce((a,r)=>a+r.cat.nmPend,0)});"
          new="nmPend:rs.reduce((a,r)=>a+r.cat.nmPend,0)}});"
          if old not in t:
              raise SystemExit('target text not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/EnhancedDashboard.tsx
          git commit -m "Auto-fix dashboard syntax"
          git push
