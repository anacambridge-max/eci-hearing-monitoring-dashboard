name: Remove right upload panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove right upload panel
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/page.tsx')
          s=p.read_text()
          s2=re.sub(r"\n    const ensureUploadPanel=\(\)=>\{.*?\n    ensureUploadPanel\(\);", "", s, count=1, flags=re.S)
          if s2==s:
              raise SystemExit('Right upload panel block not found')
          p.write_text(s2)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Remove duplicate right-side workbook upload panel"
          git rm .github/workflows/remove-right-upload-panel.yml
          git commit -m "Remove temporary upload panel workflow"
          git push
