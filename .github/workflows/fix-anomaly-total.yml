name: Fix anomaly master total

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          marker='    const attach=(table:HTMLTableElement)=>{'
          fn='''    const enhanceOverviewAnomalyTotal=()=>{\n      const active=document.querySelector('.tab.active')?.textContent?.trim()||'';\n      if(active!=='Overview')return;\n      let masterTotal=0;\n      try{\n        const raw=localStorage.getItem('eci-master');\n        const rows=raw?JSON.parse(raw):[];\n        if(Array.isArray(rows))masterTotal=rows.reduce((a,r)=>a+Number(r?.anomaly||0),0);\n      }catch{}\n      if(!masterTotal)return;\n      const headings=Array.from(document.querySelectorAll('body *')).filter(el=>el.children.length===0 && (el.textContent||'').trim().toUpperCase()==='ANOMALY');\n      const heading=headings.find(el=>{const box=el.parentElement?.parentElement;return !!box && (box.textContent||'').includes('Pending Gen') && (box.textContent||'').includes('Delivered');});\n      if(!heading)return;\n      const box=heading.parentElement?.parentElement;\n      if(!box)return;\n      if(box.querySelector('[data-anomaly-master-total="1"]'))return;\n      const row=document.createElement('div');\n      row.setAttribute('data-anomaly-master-total','1');\n      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);';\n      row.innerHTML=`<span style="font-weight:600">Total Anomaly (Master)</span><strong style="font-size:15px">${masterTotal.toLocaleString('en-IN')}</strong>`;\n      const first=box.querySelector('div');\n      if(first?.parentElement===box)box.insertBefore(row,first);else box.prepend(row);\n    };\n\n'''
          if 'const enhanceOverviewAnomalyTotal=' not in s:
              s=s.replace(marker,fn+marker,1)
          if 'enhanceOverviewAnomalyTotal();' not in s:
              s=s.replace('        enhanceGeneratedFilter();','        enhanceGeneratedFilter();\n        enhanceOverviewAnomalyTotal();',1)
          p.write_text(s)
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-anomaly-total.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/fix-anomaly-total.yml
          git commit -m "Show master anomaly total separately" || exit 0
          git push
