name: Fix anomaly card
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix anomaly card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          start=s.index('    const enhanceOverviewAnomalyTotal=()=>{')
          end=s.index('\n    const attach=', start)
          new=r'''    const enhanceOverviewAnomalyTotal=()=>{
      const active=document.querySelector('.tab.active')?.textContent?.trim()||'';
      if(active!=='Overview')return;
      let masterTotal=0;
      try{
        const raw=localStorage.getItem('eci-master');
        const rows=raw?JSON.parse(raw):[];
        if(Array.isArray(rows))masterTotal=rows.reduce((a,r)=>a+Number(r?.anomaly||0),0);
      }catch{}
      if(!masterTotal)return;
      document.querySelectorAll('[data-anomaly-master-total="1"]').forEach(el=>el.remove());
      const headings=Array.from(document.querySelectorAll('body *')).filter(el=>el.children.length===0 && (el.textContent||'').trim().toUpperCase()==='ANOMALY');
      const heading=headings.find(el=>{
        let p=el.parentElement;
        for(let i=0;i<5&&p;i++,p=p.parentElement){
          const t=(p.textContent||'');
          if(t.includes('Generated')&&t.includes('Pending Gen')&&t.includes('Delivered')&&t.includes('Pending Del'))return true;
        }
        return false;
      });
      if(!heading)return;
      let card:HTMLElement|null=heading.parentElement;
      while(card && !((card.textContent||'').includes('Generated')&&(card.textContent||'').includes('Pending Gen')&&(card.textContent||'').includes('Delivered')&&(card.textContent||'').includes('Pending Del')))card=card.parentElement;
      if(!card)return;
      const row=document.createElement('div');
      row.setAttribute('data-anomaly-master-total','1');
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);';
      row.innerHTML=`<span style="font-weight:700">Total Anomaly</span><strong style="font-size:15px">${masterTotal.toLocaleString('en-IN')}</strong>`;
      card.appendChild(row);
      card.insertBefore(row,card.children[1]||null);
    };'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY
      - name: Commit source change and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git rm .github/workflows/fix-anomaly-card.yml
          git commit -m 'Fix anomaly total placement and label'
          git push
