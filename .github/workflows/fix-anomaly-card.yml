name: Fix anomaly card
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          a=s.index('    const enhanceOverviewAnomalyTotal=()=>{')
          b=s.index('\n    const attach=',a)
          n='''    const enhanceOverviewAnomalyTotal=()=>{\n      const active=document.querySelector('.tab.active')?.textContent?.trim()||'';\n      if(active!=='Overview')return;\n      let masterTotal=0;\n      try{\n        const raw=localStorage.getItem('eci-master');\n        const rows=raw?JSON.parse(raw):[];\n        if(Array.isArray(rows))masterTotal=rows.reduce((x,r)=>x+Number(r?.anomaly||0),0);\n      }catch{}\n      if(!masterTotal)return;\n      document.querySelectorAll('[data-anomaly-master-total="1"]').forEach(el=>el.remove());\n      const heads=Array.from(document.querySelectorAll('body *')).filter(el=>el.children.length===0 && (el.textContent||'').trim().toUpperCase()==='ANOMALY');\n      const heading=heads.find(el=>{let p=el.parentElement;for(let i=0;i<6&&p;i++,p=p.parentElement){const t=p.textContent||'';if(t.includes('Generated')&&t.includes('Pending Gen')&&t.includes('Delivered')&&t.includes('Pending Del'))return true;}return false;});\n      if(!heading)return;\n      let card=heading.parentElement as HTMLElement|null;\n      while(card){const t=card.textContent||'';if(t.includes('Generated')&&t.includes('Pending Gen')&&t.includes('Delivered')&&t.includes('Pending Del'))break;card=card.parentElement;}\n      if(!card)return;\n      const row=document.createElement('div');\n      row.setAttribute('data-anomaly-master-total','1');\n      row.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);';\n      row.innerHTML='<span style="font-weight:700">Total Anomaly</span><strong style="font-size:15px">'+masterTotal.toLocaleString('en-IN')+'</strong>';\n      card.insertBefore(row,card.firstElementChild?.nextElementSibling||card.firstElementChild);\n    };'''
          p.write_text(s[:a]+n+s[b:])
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git rm .github/workflows/fix-anomaly-card.yml
          git commit -m 'Fix anomaly total placement and label'
          git push
